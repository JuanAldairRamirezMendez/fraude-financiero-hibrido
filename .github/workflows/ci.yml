name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: hashFiles('models_saved/xgboost_tier2_isotonic.pkl') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
        working-directory: backend
        env:
          APP_ENV: test
          AUTH_ENABLED: "false"
          FAIL_FAST: "true"
      - run: for attempt in {1..30}; do curl --fail http://127.0.0.1:8000/api/v1/health/live && exit 0; sleep 2; done; exit 1
      - run: npm run e2e -- --project=chromium
        working-directory: frontend
        env:
          VITE_USE_MOCKS: "false"

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fraud-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max